[package]
name = "factu"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4.44"
quick-xml = "0.39.3"
libxml = "0.3.9"
base64 = "0.22.1"
http = "1.4.0"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
